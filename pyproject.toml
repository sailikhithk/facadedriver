[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "facadedriver"
version = "0.1.0"
description = "Model-agnostic orchestration layer for multi-LLM production systems: routing, retry, fallback, circuit breakers, per-request telemetry."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Sai Likhith Kanuparthi", email = "sailikhith108@gmail.com" }
]
requires-python = ">=3.10"
keywords = [
    "llm",
    "orchestration",
    "multi-llm",
    "routing",
    "fallback",
    "circuit-breaker",
    "telemetry",
    "openai",
    "anthropic",
    "gemini",
    "litellm",
    "production",
    "reliability",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
openai = ["openai>=1.40"]
anthropic = ["anthropic>=0.34"]
google = ["google-genai>=1.0"]
litellm = ["litellm>=1.40"]
server = ["fastapi>=0.110", "uvicorn>=0.30"]
prometheus = ["prometheus-client>=0.20"]
all = [
    "openai>=1.40",
    "anthropic>=0.34",
    "google-genai>=1.0",
    "litellm>=1.40",
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "prometheus-client>=0.20",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]

[project.urls]
Homepage = "https://github.com/sailikhithk/facadedriver"
Documentation = "https://github.com/sailikhithk/facadedriver#readme"
Issues = "https://github.com/sailikhithk/facadedriver/issues"
Changelog = "https://github.com/sailikhithk/facadedriver/blob/main/CHANGELOG.md"

[project.scripts]
facadedriver = "facadedriver.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.mypy]
strict = true
python_version = "3.10"
