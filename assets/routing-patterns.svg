<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="100%" height="auto" role="img" aria-label="FacadeDriver routing patterns: round-robin, least-latency, weighted, and sticky-session routing across multiple LLM providers">
  <style>
    .title { font-family: -apple-system, Segoe UI, Helvetica, sans-serif; font-size: 22px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
    .subtitle { font-family: -apple-system, Segoe UI, Helvetica, sans-serif; font-size: 12px; fill: #475569; text-anchor: middle; }
    .card-label { font-family: -apple-system, Segoe UI, Helvetica, sans-serif; font-size: 13px; font-weight: 600; fill: #1e293b; text-anchor: middle; }
    .card-desc { font-family: -apple-system, Segoe UI, Helvetica, sans-serif; font-size: 11px; fill: #475569; }
    .bullet { font-family: -apple-system, Segoe UI, Helvetica, sans-serif; font-size: 10px; fill: #64748b; }
    .bestfor { font-family: -apple-system, Segoe UI, Helvetica, sans-serif; font-size: 10px; font-weight: 600; fill: #1e293b; }
    .number { font-family: -apple-system, Segoe UI, Helvetica, sans-serif; font-size: 16px; font-weight: 700; }
    .icon { fill: #fff; }
    @media (prefers-color-scheme: dark) {
      .title { fill: #f1f5f9; }
      .subtitle { fill: #94a3b8; }
      .card-label { fill: #e2e8f0; }
      .card-desc { fill: #cbd5e1; }
      .bullet { fill: #94a3b8; }
      .bestfor { fill: #e2e8f0; }
    }
  </style>

  <text x="440" y="32" class="title">FacadeDriver Routing Patterns</text>
  <text x="440" y="52" class="subtitle">4 ways to pick the right LLM provider for every request</text>

  <!-- Card 1: Round Robin -->
  <rect x="20" y="75" width="200" height="380" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <circle cx="70" cy="108" r="15" fill="#22c55e"/>
  <text x="70" y="114" class="number" fill="#fff" text-anchor="middle">1</text>
  <text x="120" y="114" class="card-label" text-anchor="start">Round Robin</text>
  <text x="35" y="138" class="card-desc">Cycle through providers one at a time in order.</text>

  <rect x="45" y="160" width="150" height="80" rx="6" fill="#dcfce7" stroke="#86efac"/>
  <circle cx="120" cy="180" r="12" fill="#22c55e" opacity="0.15"/>
  <text x="120" y="185" class="card-desc" text-anchor="middle" fill="#15803d">LB</text>
  <line x1="70" y1="205" x2="60" y2="225" stroke="#22c55e" stroke-width="1.5"/>
  <line x1="120" y1="205" x2="120" y2="225" stroke="#22c55e" stroke-width="1.5"/>
  <line x1="170" y1="205" x2="180" y2="225" stroke="#22c55e" stroke-width="1.5"/>
  <rect x="45" y="225" width="30" height="22" rx="3" fill="#86efac"/>
  <rect x="105" y="225" width="30" height="22" rx="3" fill="#86efac"/>
  <rect x="165" y="225" width="30" height="22" rx="3" fill="#86efac"/>
  <text x="60" y="250" class="card-desc" text-anchor="middle" font-size="9">OpenAI</text>
  <text x="120" y="250" class="card-desc" text-anchor="middle" font-size="9">Claude</text>
  <text x="180" y="250" class="card-desc" text-anchor="middle" font-size="9">Bedrock</text>

  <text x="35" y="280" class="bullet">• Simple, no telemetry needed</text>
  <text x="35" y="300" class="bullet">• Best for uniform providers</text>
  <text x="35" y="320" class="bullet">• Ignores latency and cost</text>

  <rect x="35" y="350" width="170" height="80" rx="6" fill="#dcfce7" stroke="#bbf7d0"/>
  <text x="120" y="370" class="bestfor" text-anchor="middle">Best for</text>
  <text x="120" y="390" class="bullet" text-anchor="middle">Dev / test environments</text>
  <text x="120" y="405" class="bullet" text-anchor="middle">where providers are</text>
  <text x="120" y="420" class="bullet" text-anchor="middle">interchangeable</text>

  <!-- Card 2: Least Latency -->
  <rect x="230" y="75" width="200" height="380" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <circle cx="280" cy="108" r="15" fill="#3b82f6"/>
  <text x="280" y="114" class="number" fill="#fff" text-anchor="middle">2</text>
  <text x="330" y="114" class="card-label" text-anchor="start">Least Latency</text>
  <text x="245" y="138" class="card-desc">Route to the provider with the lowest p99 latency.</text>

  <rect x="255" y="160" width="150" height="80" rx="6" fill="#dbeafe" stroke="#93c5fd"/>
  <circle cx="330" cy="180" r="12" fill="#3b82f6" opacity="0.15"/>
  <text x="330" y="185" class="card-desc" text-anchor="middle" fill="#1d4ed8">LB</text>
  <text x="275" y="218" class="card-desc" font-size="9" font-weight="600" fill="#1d4ed8">p99: 120ms</text>
  <text x="330" y="218" class="card-desc" font-size="9" font-weight="600" fill="#1d4ed8">p99: 95ms</text>
  <text x="385" y="218" class="card-desc" font-size="9" font-weight="600" fill="#1d4ed8">p99: 145ms</text>
  <line x1="330" y1="205" x2="330" y2="228" stroke="#3b82f6" stroke-width="2"/>
  <text x="330" y="250" class="card-desc" text-anchor="middle" font-size="9" font-weight="600" fill="#1d4ed8">Claude wins</text>

  <text x="245" y="280" class="bullet">• Uses OTel latency metrics</text>
  <text x="245" y="300" class="bullet">• Great for user-facing apps</text>
  <text x="245" y="320" class="bullet">• Needs warm moving window</text>

  <rect x="245" y="350" width="170" height="80" rx="6" fill="#dbeafe" stroke="#bfdbfe"/>
  <text x="330" y="370" class="bestfor" text-anchor="middle">Best for</text>
  <text x="330" y="390" class="bullet" text-anchor="middle">Low-latency SLOs</text>
  <text x="330" y="405" class="bullet" text-anchor="middle">with latency-aware</text>
  <text x="330" y="420" class="bullet" text-anchor="middle">providers</text>

  <!-- Card 3: Weighted -->
  <rect x="440" y="75" width="200" height="380" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <circle cx="490" cy="108" r="15" fill="#f59e0b"/>
  <text x="490" y="114" class="number" fill="#fff" text-anchor="middle">3</text>
  <text x="540" y="114" class="card-label" text-anchor="start">Weighted</text>
  <text x="455" y="138" class="card-desc">Split traffic by capacity, cost, or quota targets.</text>

  <rect x="465" y="160" width="150" height="80" rx="6" fill="#fef3c7" stroke="#fcd34d"/>
  <rect x="470" y="168" width="40" height="55" rx="3" fill="#fbbf24" opacity="0.7"/>
  <rect x="515" y="168" width="30" height="55" rx="3" fill="#fbbf24" opacity="0.5"/>
  <rect x="550" y="168" width="55" height="55" rx="3" fill="#fbbf24" opacity="0.85"/>
  <text x="490" y="210" class="card-desc" text-anchor="middle" font-size="9" fill="#92400e">40%</text>
  <text x="530" y="210" class="card-desc" text-anchor="middle" font-size="9" fill="#92400e">25%</text>
  <text x="577" y="210" class="card-desc" text-anchor="middle" font-size="9" fill="#92400e">35%</text>

  <text x="455" y="280" class="bullet">• Honors quota/cost budgets</text>
  <text x="455" y="300" class="bullet">• Scales with usage limits</text>
  <text x="455" y="320" class="bullet">• Adjusts in config, no code</text>

  <rect x="455" y="350" width="170" height="80" rx="6" fill="#fef3c7" stroke="#fde68a"/>
  <text x="540" y="370" class="bestfor" text-anchor="middle">Best for</text>
  <text x="540" y="390" class="bullet" text-anchor="middle">Production with mixed</text>
  <text x="540" y="405" class="bullet" text-anchor="middle">provider contracts and</text>
  <text x="540" y="420" class="bullet" text-anchor="middle">cost targets</text>

  <!-- Card 4: Sticky / Fallback -->
  <rect x="650" y="75" width="200" height="380" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <circle cx="700" cy="108" r="15" fill="#8b5cf6"/>
  <text x="700" y="114" class="number" fill="#fff" text-anchor="middle">4</text>
  <text x="750" y="114" class="card-label" text-anchor="start">Sticky + Fallback</text>
  <text x="665" y="138" class="card-desc">Keep a session on one model, fall back on failure.</text>

  <rect x="675" y="160" width="150" height="80" rx="6" fill="#ede9fe" stroke="#c4b5fd"/>
  <circle cx="750" cy="180" r="12" fill="#8b5cf6" opacity="0.15"/>
  <text x="750" y="185" class="card-desc" text-anchor="middle" fill="#6d28d9">LB</text>
  <line x1="720" y1="205" x2="705" y2="228" stroke="#8b5cf6" stroke-width="1.5"/>
  <line x1="780" y1="205" x2="795" y2="228" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="3,3"/>
  <rect x="690" y="228" width="30" height="22" rx="3" fill="#c4b5fd"/>
  <rect x="780" y="228" width="30" height="22" rx="3" fill="#ddd6fe"/>
  <text x="705" y="250" class="card-desc" text-anchor="middle" font-size="9">primary</text>
  <text x="795" y="250" class="card-desc" text-anchor="middle" font-size="9">fallback</text>

  <text x="665" y="280" class="bullet">• Maintains conversation state</text>
  <text x="665" y="300" class="bullet">• Configurable fallback chain</text>
  <text x="665" y="320" class="bullet">• Retry with backoff</text>

  <rect x="665" y="350" width="170" height="80" rx="6" fill="#ede9fe" stroke="#ddd6fe"/>
  <text x="750" y="370" class="bestfor" text-anchor="middle">Best for</text>
  <text x="750" y="390" class="bullet" text-anchor="middle">Stateful agents and</text>
  <text x="750" y="405" class="bullet" text-anchor="middle">resilient production</text>
  <text x="750" y="420" class="bullet" text-anchor="middle">workloads</text>

  <text x="440" y="490" class="subtitle">FacadeDriver lets you mix these per route via a single YAML config.</text>
</svg>
