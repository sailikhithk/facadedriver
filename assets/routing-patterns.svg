<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 545" width="100%" height="auto" role="img" aria-label="FacadeDriver routing patterns: round-robin, least-latency, weighted, and sticky-session routing across multiple LLM providers">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    .title { font-family: -apple-system, Segoe UI, Helvetica, sans-serif; font-size: 22px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
    .subtitle { font-family: -apple-system, Segoe UI, Helvetica, sans-serif; font-size: 12px; fill: #475569; text-anchor: middle; }
    .card-label { font-family: -apple-system, Segoe UI, Helvetica, sans-serif; font-size: 15px; font-weight: 700; fill: #1e293b; }
    .card-desc { font-family: -apple-system, Segoe UI, Helvetica, sans-serif; font-size: 11px; fill: #475569; }
    .bullet { font-family: -apple-system, Segoe UI, Helvetica, sans-serif; font-size: 10px; fill: #475569; }
    .best-label { font-family: -apple-system, Segoe UI, Helvetica, sans-serif; font-size: 11px; font-weight: 700; fill: #1e293b; text-anchor: middle; }
    .best-text { font-family: -apple-system, Segoe UI, Helvetica, sans-serif; font-size: 10px; fill: #475569; text-anchor: middle; }
    .number { font-family: -apple-system, Segoe UI, Helvetica, sans-serif; font-size: 15px; font-weight: 700; }
    .inner { font-family: -apple-system, Segoe UI, Helvetica, sans-serif; font-size: 10px; fill: #475569; text-anchor: middle; }
    @media (prefers-color-scheme: dark) {
      .title { fill: #f1f5f9; }
      .subtitle { fill: #94a3b8; }
      .card-label { fill: #e2e8f0; }
      .card-desc { fill: #cbd5e1; }
      .bullet { fill: #cbd5e1; }
      .best-label { fill: #e2e8f0; }
      .best-text { fill: #cbd5e1; }
      .inner { fill: #cbd5e1; }
    }
  </style>

  <text x="550" y="32" class="title">FacadeDriver Routing Patterns</text>
  <text x="550" y="52" class="subtitle">4 ways to pick the right LLM provider for every request</text>

  <!-- Card 1: Round Robin -->
  <rect x="40" y="75" width="240" height="470" rx="14" fill="#f0fdf4" stroke="#22c55e" stroke-width="2.5"/>
  <circle cx="64" cy="108" r="13" fill="#22c55e"/>
  <text x="64" y="113" class="number" fill="#fff" text-anchor="middle">1</text>
  <text x="88" y="113" class="card-label">Round Robin</text>
  <text x="58" y="140" class="card-desc">Cycle through providers in a fixed order.
    <tspan x="58" dy="15">Simple and predictable.</tspan>
  </text>

  <rect x="58" y="175" width="204" height="110" rx="8" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
  <g transform="translate(58, 175)">
    <circle cx="102" cy="22" r="10" fill="#22c55e"/>
    <rect x="15" y="45" width="55" height="32" rx="4" fill="#86efac"/>
    <rect x="75" y="45" width="55" height="32" rx="4" fill="#86efac"/>
    <rect x="135" y="45" width="55" height="32" rx="4" fill="#86efac"/>
    <line x1="70" y1="61" x2="75" y2="61" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="130" y1="61" x2="135" y2="61" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="42" y="92" class="inner" style="font-size:9px">OpenAI</text>
    <text x="102" y="92" class="inner" style="font-size:9px">Claude</text>
    <text x="162" y="92" class="inner" style="font-size:9px">Bedrock</text>
  </g>

  <text x="58" y="313" class="bullet">• Simple, no telemetry needed</text>
  <text x="58" y="328" class="bullet">• Best when providers are uniform</text>
  <text x="58" y="343" class="bullet">• Ignores latency and cost</text>

  <rect x="58" y="420" width="204" height="100" rx="8" fill="#dcfce7" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="160" y="442" class="best-label">Best for</text>
  <text x="160" y="462" class="best-text">Dev and test environments</text>
  <text x="160" y="477" class="best-text">with interchangeable providers</text>

  <!-- Card 2: Least Latency -->
  <rect x="300" y="75" width="240" height="470" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2.5"/>
  <circle cx="324" cy="108" r="13" fill="#3b82f6"/>
  <text x="324" y="113" class="number" fill="#fff" text-anchor="middle">2</text>
  <text x="348" y="113" class="card-label">Least Latency</text>
  <text x="318" y="140" class="card-desc">Route to the provider with the lowest
    <tspan x="318" dy="15">p99 latency.</tspan>
  </text>

  <rect x="318" y="175" width="204" height="110" rx="8" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
  <g transform="translate(318, 175)">
    <text x="102" y="25" class="inner" style="font-size:10px; fill:#1d4ed8">p99 latency</text>
    <rect x="25" y="42" width="154" height="22" rx="4" fill="#93c5fd" opacity="0.4"/>
    <text x="102" y="57" class="inner" style="font-size:10px; font-weight:600; fill:#1d4ed8">Claude: 95ms (winner)</text>
    <text x="102" y="82" class="inner" style="font-size:9px">OpenAI: 120ms</text>
    <text x="102" y="98" class="inner" style="font-size:9px">Bedrock: 145ms</text>
  </g>

  <text x="318" y="313" class="bullet">• Uses OTel latency metrics</text>
  <text x="318" y="328" class="bullet">• Best for user-facing apps</text>
  <text x="318" y="343" class="bullet">• Needs a warm moving window</text>

  <rect x="318" y="420" width="204" height="100" rx="8" fill="#dbeafe" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="420" y="442" class="best-label">Best for</text>
  <text x="420" y="462" class="best-text">Low-latency SLOs with</text>
  <text x="420" y="477" class="best-text">latency-aware providers</text>

  <!-- Card 3: Weighted -->
  <rect x="560" y="75" width="240" height="470" rx="14" fill="#fffbeb" stroke="#f59e0b" stroke-width="2.5"/>
  <circle cx="584" cy="108" r="13" fill="#f59e0b"/>
  <text x="584" y="113" class="number" fill="#fff" text-anchor="middle">3</text>
  <text x="608" y="113" class="card-label">Weighted</text>
  <text x="578" y="140" class="card-desc">Split traffic by capacity, cost budget,
    <tspan x="578" dy="15">or quota target.</tspan>
  </text>

  <rect x="578" y="175" width="204" height="110" rx="8" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.5"/>
  <g transform="translate(578, 175)">
    <rect x="30" y="35" width="35" height="50" rx="3" fill="#fbbf24" opacity="0.8"/>
    <rect x="85" y="55" width="22" height="30" rx="3" fill="#fbbf24" opacity="0.55"/>
    <rect x="140" y="41" width="31" height="44" rx="3" fill="#fbbf24" opacity="0.7"/>
    <text x="47" y="95" class="inner" style="font-size:9px; fill:#92400e">40%</text>
    <text x="96" y="95" class="inner" style="font-size:9px; fill:#92400e">25%</text>
    <text x="155" y="95" class="inner" style="font-size:9px; fill:#92400e">35%</text>
  </g>

  <text x="578" y="313" class="bullet">• Honors quota and cost budgets</text>
  <text x="578" y="328" class="bullet">• Scales with usage limits</text>
  <text x="578" y="343" class="bullet">• Adjusts in YAML, no code</text>

  <rect x="578" y="420" width="204" height="100" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
  <text x="680" y="442" class="best-label">Best for</text>
  <text x="680" y="462" class="best-text">Production with mixed contracts</text>
  <text x="680" y="477" class="best-text">and cost targets</text>

  <!-- Card 4: Sticky + Fallback -->
  <rect x="820" y="75" width="240" height="470" rx="14" fill="#fdf2f8" stroke="#ec4899" stroke-width="2.5"/>
  <circle cx="844" cy="108" r="13" fill="#ec4899"/>
  <text x="844" y="113" class="number" fill="#fff" text-anchor="middle">4</text>
  <text x="868" y="113" class="card-label">Sticky + Fallback</text>
  <text x="838" y="140" class="card-desc">Keep a session on one model and fall
    <tspan x="838" dy="15">back through a chain on failure.</tspan>
  </text>

  <rect x="838" y="175" width="204" height="110" rx="8" fill="#fce7f3" stroke="#f9a8d4" stroke-width="1.5"/>
  <g transform="translate(838, 175)">
    <rect x="25" y="30" width="65" height="40" rx="4" fill="#c4b5fd"/>
    <rect x="115" y="30" width="65" height="40" rx="4" fill="#ddd6fe"/>
    <line x1="90" y1="50" x2="115" y2="50" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <text x="57" y="90" class="inner" style="font-size:9px">primary</text>
    <text x="147" y="90" class="inner" style="font-size:9px">fallback</text>
    <text x="102" y="104" class="inner" style="font-size:8px">OpenAI → Claude → Bedrock</text>
  </g>

  <text x="838" y="313" class="bullet">• Maintains conversation state</text>
  <text x="838" y="328" class="bullet">• Configurable fallback chain</text>
  <text x="838" y="343" class="bullet">• Retry with backoff</text>

  <rect x="838" y="420" width="204" height="100" rx="8" fill="#fce7f3" stroke="#fbcfe8" stroke-width="1.5"/>
  <text x="940" y="442" class="best-label">Best for</text>
  <text x="940" y="462" class="best-text">Stateful agents and resilient</text>
  <text x="940" y="477" class="best-text">production workloads</text>

  <text x="550" y="535" class="subtitle">Mix any of these per route through a single YAML config.</text>
</svg>