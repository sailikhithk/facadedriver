<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="auto" role="img" aria-label="FacadeDriver architecture: request routing with retry, fallback, and circuit breakers across multiple LLM providers">
  <style>
    .label { font-family: -apple-system, Segoe UI, Helvetica, sans-serif; font-size: 13px; fill: #1a1a1a; }
    .title { font-family: -apple-system, Segoe UI, Helvetica, sans-serif; font-size: 16px; font-weight: 600; fill: #0f172a; }
    .small { font-family: -apple-system, Segoe UI, Helvetica, sans-serif; font-size: 11px; fill: #475569; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; fill: #1e293b; }
    @media (prefers-color-scheme: dark) {
      .label { fill: #e2e8f0; }
      .title { fill: #f1f5f9; }
      .small { fill: #94a3b8; }
      .mono { fill: #cbd5e1; }
    }
  </style>

  <!-- Title -->
  <text x="400" y="28" text-anchor="middle" class="title">FacadeDriver: Multi-LLM Orchestration</text>
  <text x="400" y="48" text-anchor="middle" class="small">Routing - Retry - Fallback - Circuit Breakers - Telemetry</text>

  <!-- App node -->
  <rect x="20" y="170" width="110" height="60" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="75" y="195" text-anchor="middle" class="label">Your App</text>
  <text x="75" y="215" text-anchor="middle" class="small">facade.generate()</text>

  <!-- FacadeDriver core -->
  <rect x="180" y="120" width="160" height="160" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="260" y="145" text-anchor="middle" class="label" font-weight="600">FacadeDriver</text>
  <text x="260" y="165" text-anchor="middle" class="small">YAML route config</text>
  <line x1="195" y1="180" x2="325" y2="180" stroke="#f59e0b" stroke-width="0.5" stroke-dasharray="3,3"/>
  <text x="260" y="198" text-anchor="middle" class="mono">router</text>
  <text x="260" y="218" text-anchor="middle" class="mono">retry + backoff</text>
  <text x="260" y="238" text-anchor="middle" class="mono">circuit breaker</text>
  <text x="260" y="258" text-anchor="middle" class="mono">OTel telemetry</text>

  <!-- Animated request pulse from App to FacadeDriver -->
  <circle r="5" fill="#3b82f6">
    <animate attributeName="cx" from="130" to="180" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="cy" from="200" to="200" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="1.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Provider nodes -->
  <rect x="420" y="80" width="130" height="50" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="485" y="100" text-anchor="middle" class="label">OpenAI</text>
  <text x="485" y="118" text-anchor="middle" class="small">gpt-4o, o1</text>

  <rect x="420" y="155" width="130" height="50" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="2"/>
  <text x="485" y="175" text-anchor="middle" class="label">Anthropic</text>
  <text x="485" y="193" text-anchor="middle" class="small">claude-3.5</text>

  <rect x="420" y="230" width="130" height="50" rx="8" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <text x="485" y="250" text-anchor="middle" class="label">AWS Bedrock</text>
  <text x="485" y="268" text-anchor="middle" class="small">30+ models</text>

  <rect x="420" y="305" width="130" height="50" rx="8" fill="#fef9c3" stroke="#eab308" stroke-width="2"/>
  <text x="485" y="325" text-anchor="middle" class="label">vLLM (self-hosted)</text>
  <text x="485" y="343" text-anchor="middle" class="small">local GPU</text>

  <!-- Animated routing arrows (cycling through providers) -->
  <g stroke-width="2" fill="none">
    <path d="M 340 180 L 420 105" stroke="#22c55e" opacity="0.7">
      <animate attributeName="stroke-dashoffset" from="80" to="0" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="stroke-dasharray" values="0,80;40,40;80,0" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M 340 200 L 420 180" stroke="#ec4899" opacity="0.7">
      <animate attributeName="stroke-dashoffset" from="80" to="0" dur="2s" begin="0.5s" repeatCount="indefinite"/>
      <animate attributeName="stroke-dasharray" values="0,80;40,40;80,0" dur="2s" begin="0.5s" repeatCount="indefinite"/>
    </path>
    <path d="M 340 220 L 420 255" stroke="#6366f1" opacity="0.7">
      <animate attributeName="stroke-dashoffset" from="80" to="0" dur="2s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="stroke-dasharray" values="0,80;40,40;80,0" dur="2s" begin="1s" repeatCount="indefinite"/>
    </path>
    <path d="M 340 240 L 420 330" stroke="#eab308" opacity="0.7">
      <animate attributeName="stroke-dashoffset" from="80" to="0" dur="2s" begin="1.5s" repeatCount="indefinite"/>
      <animate attributeName="stroke-dasharray" values="0,80;40,40;80,0" dur="2s" begin="1.5s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Fallback indicator -->
  <text x="380" y="375" text-anchor="middle" class="small">Fallback chain: OpenAI -> Anthropic -> Bedrock -> vLLM</text>

  <!-- Circuit breaker indicator (pulsing) -->
  <circle cx="350" cy="130" r="6" fill="#ef4444">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1s" repeatCount="indefinite"/>
    <animate attributeName="r" values="4;7;4" dur="1s" repeatCount="indefinite"/>
  </circle>
  <text x="365" y="134" class="small">circuit breaker</text>

  <!-- Telemetry out -->
  <rect x="600" y="170" width="100" height="60" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="650" y="195" text-anchor="middle" class="label">OTel</text>
  <text x="650" y="215" text-anchor="middle" class="small">per-request</text>
  <line x1="340" y1="200" x2="600" y2="200" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.5">
    <animate attributeName="stroke-dashoffset" from="0" to="-16" dur="0.8s" repeatCount="indefinite"/>
  </line>
</svg>
